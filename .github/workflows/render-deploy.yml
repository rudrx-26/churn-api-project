name: Render Deploy Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # - name: Run tests
      #   run: pytest   # Uncomment this if you have tests!
# No deploy command needed: Render auto-deploys when you push!
